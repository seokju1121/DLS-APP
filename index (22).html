<title>ENTJ의 Digibooks Life OS</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --ink:#1c2430; --sub:#6b7684;
  --accent:#2b6cb0; --accent-soft:#e8f0fa; --gold:#b7791f; --gold-soft:#fdf3df;
  --green:#2f855a; --green-soft:#e6f4ec; --red:#c53030; --red-soft:#fdecec;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
textarea{resize:vertical}
.hidden{display:none!important}

/* ---------- 로그인 ---------- */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 28px;width:320px;text-align:center}
.login-box h1{font-size:28px;letter-spacing:2px;margin-bottom:4px}
.login-box p{color:var(--sub);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;text-align:center;letter-spacing:4px;margin-bottom:10px}
.login-box input.plain{text-align:left;letter-spacing:normal;font-size:15px;color:var(--ink)}
.login-box input.plain::placeholder{color:#9aa4b0;letter-spacing:normal}
.btn{display:inline-block;padding:11px 16px;border-radius:8px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-ghost{background:none;color:var(--sub);width:100%;margin-top:8px;border:1px solid var(--line)}
.btn-sm{padding:6px 12px;border-radius:6px;font-size:13px}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-green{background:var(--green);color:#fff}

/* ---------- 레이아웃 ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:20px 14px 90px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform .2s}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;padding:0 8px 16px}
.logo span{color:var(--accent)}
.nav-group{margin-bottom:18px}
.nav-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:1px;padding:0 8px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--ink);font-weight:500}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.nav-item.active .dot{background:#fff}
#main{flex:1;margin-left:230px;padding:26px 28px 120px;max-width:980px}
@media(max-width:820px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.2)}
  #main{margin-left:0;padding:18px 14px 120px}
  #menuToggle{display:flex!important}
}
#menuToggle{display:none;position:fixed;top:14px;left:14px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;align-items:center;justify-content:center;font-size:18px}

/* 하단 3줄바 플로팅 버튼 */
#fabMenu{position:fixed;right:20px;bottom:20px;z-index:70}
#fabBtn{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(43,108,176,.35);display:flex;align-items:center;justify-content:center}
#fabList{position:absolute;bottom:66px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px}
#fabList button{display:flex;gap:8px;align-items:center;width:100%;padding:12px 16px;text-align:left;font-weight:500}
#fabList button:hover{background:var(--accent-soft)}

/* ---------- 공통 카드 ---------- */
.page-title{font-size:22px;font-weight:800;margin-bottom:2px}
.page-sub{color:var(--sub);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3 .hint{font-size:12px;color:var(--sub);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.row2{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);font-size:13px;padding:12px;text-align:center;background:var(--bg);border-radius:8px}

/* ---------- 상태창(퀘스트) ---------- */
.quest-window{position:relative;border:2px solid var(--gold);border-radius:6px;background:linear-gradient(180deg,#fffdf6,#fdf6e4);padding:22px 20px;margin-bottom:14px}
.quest-window::before,.quest-window::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold)}
.quest-window::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.quest-window::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.quest-label{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800;margin-bottom:8px}
.quest-text{font-size:17px;font-weight:700;line-height:1.5}
.quest-meta{margin-top:10px;font-size:12px;color:var(--sub)}
.quest-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 인사이트 저장소 ---------- */
.room{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fcfdfe}
.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.room-head b{font-size:14px}
.insight-item{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;font-size:14px}
.insight-item:hover{background:var(--accent-soft)}
.insight-item .star{font-size:15px;color:#c9ced6;flex-shrink:0}
.insight-item .star.on{color:var(--gold)}
.insight-item .del{margin-left:auto;color:#c9ced6;font-size:12px;flex-shrink:0}
.insight-item .del:hover{color:var(--red)}
.lineup-badge{background:var(--gold-soft);color:var(--gold);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;flex-shrink:0}
.app-icon{width:22px;height:22px;border-radius:6px;flex-shrink:0;object-fit:cover;background:#eef1f4}
a.app-link{color:var(--ink);text-decoration:none;font-weight:600}
a.app-link:hover{color:var(--accent);text-decoration:underline}
.cal-day{cursor:pointer}
.day-item{padding:8px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;font-size:14px;display:flex;align-items:center;gap:8px}
.day-item .del{margin-left:auto;color:#c9ced6;font-size:12px}
.day-item .del:hover{color:var(--red)}

/* ---------- 리스트 ---------- */
.hist-item{padding:10px 12px;border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 8px 8px 0;margin-bottom:8px;font-size:14px}
.hist-item .when{font-size:11px;color:var(--sub)}
.hist-item .rev{margin-top:4px;font-size:13px;color:#3c4a5a}
.rec-item{padding:9px 12px;border-radius:8px;background:var(--bg);margin-bottom:7px;font-size:14px}
.rec-item .when{font-size:11px;color:var(--sub)}

/* ---------- 캘린더 ---------- */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--sub);font-weight:700;padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;position:relative;background:#fff;border:1px solid transparent}
.cal-day:hover{border-color:var(--line)}
.cal-day.today{border-color:var(--accent);font-weight:800;color:var(--accent)}
.cal-day .marks{display:flex;gap:2px;margin-top:2px}
.cal-day .m{width:5px;height:5px;border-radius:50%}
.m.quest{background:var(--green)} .m.record{background:var(--accent)} .m.plan{background:var(--gold)}

/* ---------- HP/MP ---------- */
.bar-wrap{margin-bottom:16px}
.bar-label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:6px}
.bar{height:18px;border-radius:10px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;transition:width .3s}
.bar-hp>div{background:linear-gradient(90deg,#e53e3e,#fc8181)}
.bar-mp>div{background:linear-gradient(90deg,#3182ce,#63b3ed)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.chip:hover{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- 모달 ---------- */
#modalBack{position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
#modalBox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
#modalBox h3{margin-bottom:12px;font-size:16px}
#modalBox textarea,#modalBox input,#modalBox select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modal-full{width:min(96vw,900px)!important;max-width:96vw!important;height:92vh;max-height:92vh;display:flex;flex-direction:column;overflow:auto}
.modal-full .grow-area{flex:1;display:flex;flex-direction:column}
.modal-full .grow-area textarea{flex:1;min-height:50vh;font-size:15px;line-height:1.7;resize:none}

/* ---------- 오늘 기록 ---------- */
.quote-box{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;margin-bottom:14px}
.quote-box .who{font-size:12px;color:var(--sub);margin-top:4px}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}
.loading{display:inline-block;color:var(--sub);font-size:13px}
.loading::after{content:"…";animation:dots 1.2s infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}
.notice{font-size:12px;color:var(--sub);margin-top:8px}
.cat-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat{padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px}
.cat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

function defaultState(){
  const d = {};
  for(const k in DOMAINS){
    d[k] = {
      nav:{current:"",goal:""},
      customCats:[],
      quests:[],
      insights:{app:[],sns:[],book:[],quote:[]},
      records:[],
      newInsight:null
    };
  }
  return {domains:d, calendar:[], journal:[], hp:70, mp:70, hpmpLog:[], hpmpLastDecay:Date.now(), ideas:[], feedback:[]};
}
function storageKey(){ return authUser ? ('dls_u_' + authUser.id) : 'dls_guest'; }
function save(){
  localStorage.setItem(storageKey(), JSON.stringify(S));
  syncToSupabase();
}

// 로그인 안 했으면 서버에 아무것도 안 올림 (게스트 = 이 기기 전용)
async function syncToSupabase(){
  if(!sb || !authUser) return;
  const uid = authUser.id;
  let firstErr = null;
  // Supabase는 실패해도 예외를 안 던지고 error로 돌려줌 → 반드시 확인
  const put = async (table, row, conflict) => {
    const {error} = await sb.from(table).upsert(row, {onConflict:conflict});
    if(error && !firstErr){
      firstErr = table + ': ' + (error.message || error.code || '알 수 없음');
      console.error('[동기화 실패]', table, error);
    }
  };
  try{
    for(const dk of Object.keys(S.domains)){
      const d = S.domains[dk];
      await put('domains', {
        user_id: uid, name: dk,
        nav_current: d.nav?.current||'', nav_goal: d.nav?.goal||'',
        updated_at: new Date().toISOString()
      }, 'user_id,name');
      for(const q of d.quests){
        await put('quests', {
          id: String(q.id), user_id: uid, domain_name: dk,
          quest_text: q.text, category: q.cat||'', status: q.status,
          created_at: new Date(q.createdAt||Date.now()).toISOString(),
          cleared_at: q.clearedAt?new Date(q.clearedAt).toISOString():null,
          review: q.review||''
        }, 'id');
      }
      for(const rk of Object.keys(d.insights||{})){
        for(const i of d.insights[rk]){
          await put('insights_saved', {
            id: String(i.id), user_id: uid, domain_name: dk, room: rk,
            title: i.text, url: i.url||'', category: i.cat||'', notes: i.notes||''
          }, 'id');
        }
      }
    }
    await put('hpmp', {
      user_id: uid, hp: S.hp, mp: S.mp,
      last_decay: new Date(S.hpmpLastDecay||Date.now()).toISOString()
    }, 'user_id');

    setSyncBadge(firstErr ? ('저장 실패 · ' + firstErr) : '저장됨');
  }catch(e){
    console.error('[동기화 예외]', e);
    setSyncBadge('저장 실패 · ' + (e.message||''));
  }
}

function setSyncBadge(t){
  const el = document.getElementById('syncBadge');
  if(el){
    el.textContent = t;
    el.style.color = /실패/.test(t) ? 'var(--red)' : 'var(--sub)';
  }
}

async function pullFromSupabase(){
  if(!sb || !authUser) return;
  const uid = authUser.id;
  try{
    const [rDom, rQ, rIns, rHp] = await Promise.all([
      sb.from('domains').select('*').eq('user_id', uid),
      sb.from('quests').select('*').eq('user_id', uid),
      sb.from('insights_saved').select('*').eq('user_id', uid),
      sb.from('hpmp').select('*').eq('user_id', uid)
    ]);
    const bad = [rDom, rQ, rIns, rHp].find(r => r.error);
    if(bad){
      console.error('[불러오기 실패]', bad.error);
      setSyncBadge('불러오기 실패 · ' + (bad.error.message||''));
    }
    const domains = rDom.data, quests = rQ.data, insightsRows = rIns.data, hpmpRows = rHp.data;
    if(domains) domains.forEach(d=>{
      if(!S.domains[d.name]) S.domains[d.name] = defaultState().domains[d.name] || {nav:{current:'',goal:''},customCats:[],quests:[],insights:{app:[],sns:[],book:[],quote:[]},records:[],newInsight:null};
      S.domains[d.name].nav = {current: d.nav_current||'', goal: d.nav_goal||''};
    });
    if(quests) quests.forEach(q=>{
      const dk = q.domain_name;
      if(!S.domains[dk]) return;
      const exists = S.domains[dk].quests.find(x=>x.id===q.id);
      if(!exists){
        S.domains[dk].quests.push({
          id:q.id, text:q.quest_text, cat:q.category||'', status:q.status,
          createdAt:new Date(q.created_at).getTime(),
          clearedAt:q.cleared_at?new Date(q.cleared_at).getTime():null,
          review:q.review||''
        });
      }
    });
    if(insightsRows) insightsRows.forEach(i=>{
      const dk=i.domain_name, rk=i.room;
      if(!S.domains[dk]) return;
      if(!S.domains[dk].insights[rk]) S.domains[dk].insights[rk]=[];
      const exists = S.domains[dk].insights[rk].find(x=>x.id===i.id);
      if(!exists){
        S.domains[dk].insights[rk].push({id:i.id, text:i.title, cat:i.category||'', starred:false, url:i.url||'', notes:i.notes||''});
      }
    });
    if(hpmpRows && hpmpRows.length){
      S.hp = hpmpRows[0].hp; S.mp = hpmpRows[0].mp;
      S.hpmpLastDecay = new Date(hpmpRows[0].last_decay).getTime();
    }
    localStorage.setItem(storageKey(), JSON.stringify(S));
  }catch(e){ console.log('불러오기 실패(로컬 데이터 유지):', e.message); }
}
function load(){
  const raw = localStorage.getItem(storageKey());
  S = raw ? JSON.parse(raw) : defaultState();
  for(const k in DOMAINS){
    if(!S.domains[k]) S.domains[k]=defaultState().domains[k];
  }
  // 마이그레이션: 기존 도메인별 events → calendar로 통합
  if(!S.calendar) S.calendar=[];
  for(const dk in DOMAINS){
    if(S.domains[dk].events && Array.isArray(S.domains[dk].events)){
      S.domains[dk].events.forEach(e=>{ S.calendar.push({...e, domain:dk}); });
      delete S.domains[dk].events;
    }
  }
  // 중복 제거
  const seen = new Set();
  S.calendar = S.calendar.filter(e=>{
    const key = `${e.date}:${e.text}`;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  // 마이그레이션: 저장된 옛 교보 URL → 새 검색 URL로 자동 교체
  for(const dk in DOMAINS){
    ROOMS.forEach(([rk])=>{
      (S.domains[dk].insights[rk]||[]).forEach(i=>{
        if(i.url && i.url.includes('ebook.kyobobook.co.kr/search')){
          const kw = (i.url.split('keyword=')[1]||'').split('&')[0];
          i.url = 'https://search.kyobobook.co.kr/search?gbCode=TOT&target=ebook&keyword='+kw;
        }
      });
    });
  }
  save();
}

function applyHpMpDecay(){
  // 마지막 감소 이후 경과 시간 계산 (밀리초 → 시간)
  const now = Date.now();
  const lastDecay = S.hpmpLastDecay || now;
  const elapsedHours = (now - lastDecay) / (1000 * 60 * 60);
  
  // 24시간마다 HP/MP 각각 10씩 감소 (느린 속도 - 약 10일이면 바닥)
  const decayAmount = Math.floor(elapsedHours / 24) * 10;
  
  if(decayAmount > 0){
    S.hp = Math.max(0, S.hp - decayAmount);
    S.mp = Math.max(0, S.mp - decayAmount);
    S.hpmpLastDecay = now;
    save();
    
    // 감소를 알려주는 로그 (HP/MP가 50 이하면 경고)
    if(S.hp <= 50 || S.mp <= 50){
      S.hpmpLog.push({text:`⏳ 시간이 지나 체력이 감소했습니다 (HP${S.hp}, MP${S.mp})`,when:now});
    }
  }
}

async function callAI(prompt, messages){
  const key = getApiKey();
  const headers = {"Content-Type":"application/json"};
  if(key){
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers,
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages: messages || [{role:"user",content:prompt}]})
  });
  if(!res.ok){ throw new Error('API 오류 '+res.status); }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join("\n");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

  try{
    const out = await callAI(questPrompt(dk));
    d.quests.push({id:uid(),text:out.quest,cat:out.cat||'',status:'active',createdAt:Date.now()});
    // 라인업 별표 반영
    const names = (out.lineup||[]).map(n=>n.trim());
    ['app','sns'].forEach(rk=> d.insights[rk].forEach(i=>{ i.starred = names.some(n=> i.text.includes(n)||n.includes(i.text)); }));

function addManualQuest(dk){
  const text = document.getElementById('manualQuest').value.trim();
  if(!text){ alert('퀘스트 내용을 적어주세요.'); return; }
  S.domains[dk].quests.push({id:uid(), text, cat:'', status:'active', createdAt:Date.now()});
  save(); closeModal(); go('d:'+dk);
}
function skipQuest(dk,qid){
  const q = S.domains[dk].quests.find(x=>x.id===qid);
  if(q){ q.status='done'; q.clearedAt=Date.now(); q.review='(건너뜀)'; }
  save(); go('d:'+dk);
}
function saveNav(dk){
  S.domains[dk].nav.current = document.getElementById('navCur').value.trim();
  S.domains[dk].nav.goal = document.getElementById('navGoal').value.trim();
  save(); go('d:'+dk);
}
function addCat(dk){
  openModal(`<h3>하위 카테고리 추가</h3>
    <input id="mCat" placeholder="예: 자격증">
    <div class="modal-actions"><button class="btn btn-sm btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-sm btn-accent" onclick="doAddCat('${dk}')">추가</button></div>`);
}
function doAddCat(dk){
  const v=document.getElementById('mCat').value.trim();
  if(v) S.domains[dk].customCats.push(v);
  save(); closeModal(); go('d:'+dk);
}
function catOptions(dk){
  return ['<option value="">카테고리 없음</option>'].concat(
    DOMAINS[dk].cats.concat(S.domains[dk].customCats).map(c=>`<option>${esc(c)}</option>`)).join('');
}

function openRecs(dk,rk){
  const label = ROOMS.find(r=>r[0]===rk)[1];
  const mine = S.domains[dk].insights[rk].map(i=>i.text);
  const isLinkable = (rk==='app'||rk==='sns'||rk==='book');
  
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '✨ AI가 추천 중...';
  
  // AI에게 현 상황에 맞는 추천을 생성하도록 요청
  callAI(`너는 ${dk} 영역의 추천 전문가다. 사용자의 현재 상황을 분석하고 ${rk==='app'?'유용한 앱':rk==='sns'?'실용적인 SNS':'도움이 될 책'}을 추천하라.

[사용자 정보]
도메인: ${dk}
현재 상태: ${S.domains[dk].nav.current||'미입력'}
최종 목표: ${S.domains[dk].nav.goal||'미입력'}
HP/MP: ${S.hp}/100, ${S.mp}/100

[이미 담은 ${label}]
${mine.length? mine.map((t,i)=>(i+1)+'. '+t).join('\n') : '(없음)'}

[최근 퀘스트 경험]
${S.domains[dk].quests.filter(q=>q.status==='done').slice(-3).map(q=>'- '+q.text).join('\n') || '(없음)'}

규칙:
1. 아직 담지 않은 새로운 항목만 추천하라.
2. 사용자의 현재 상태·목표·HP/MP 상황을 반영해 개인화된 추천을 하라.
3. 각 항목마다: title(이름), url(필요하면 링크), why(왜 지금 이게 좋은지 한 문장), desc(이 앱/자료가 무엇인지 정확히 3줄 요약, 줄마다 \\n으로 구분) 포함.
4. 3~5개만 추천.

JSON만 출력:
{"recommendations":[{"title":"...","url":"...","why":"...","desc":"1줄\\n2줄\\n3줄"}]}`).then(data=>{
    const recs = (data.recommendations||[]).filter(r=>!mine.includes(r.title));
    showRecsModal(dk, rk, recs, mine, isLinkable);
  }).catch(err=>{
    // AI 실패 시(오프라인 등) 확장 풀에서 무작위 추천
    const base = ((RECS[dk]&&RECS[dk][rk])||[]).map(r=>({title:r.t, url:r.u||'', why:r.w||'기본 추천', desc:r.d||''}));
    const extra = ((RECS_EXTRA[dk]&&RECS_EXTRA[dk][rk])||[]).map(r=>({title:r.t, url:r.u||'', why:r.w||'추천 풀', desc:r.d||''}));
    const pool = base.concat(extra).filter(r=>!mine.includes(r.title));
    // 무작위 셔플
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    let picked = pool.slice(0,6);
    // 큐레이션이 부족하면 목표 기반 탐색 카드로 채움 (무한 생성)
    if(picked.length < 6){
      const used = mine.concat(picked.map(p=>p.title));
      picked = picked.concat(genExplore(dk, rk, 6-picked.length, used));
    }
    showRecsModal(dk, rk, picked, mine, isLinkable);
  }).finally(()=>{
    btn.disabled = false;
    btn.textContent = originalText;
  });
}

const EXPLORE_MODS = ['입문 가이드','추천 루틴','한 달 계획','실패하는 이유','체크리스트','초보가 하는 실수','도구 추천','성공 사례','단계별 방법','자주 하는 질문','전문가 조언','최신 트렌드','무료 자료','비교 정리','습관 만들기','30일 챌린지','핵심 원리','현실 후기','시작하는 법','우선순위 정하기'];

function genExplore(dk, rk, count, used){
  const d = S.domains[dk];
  // 검색 기준 키워드: 목표 > 하위 카테고리 > 도메인 기본 키워드
  const seeds = [];
  if(d.nav.goal) seeds.push(d.nav.goal);
  (d.customCats||[]).forEach(c=>seeds.push(c));
  seeds.push(DOMAIN_KEYWORD[dk] || dk);
  const clean = seeds.map(x=>String(x).trim().slice(0,20)).filter(Boolean);

  // 조합을 섞어서 아직 안 쓴 것부터
  const combos = [];
  clean.forEach(seed=> EXPLORE_MODS.forEach(mod=> combos.push({seed, mod})));
  for(let i=combos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [combos[i],combos[j]]=[combos[j],combos[i]]; }

  const out = [];
  for(const c of combos){
    if(out.length >= count) break;
    const kw = c.seed + ' ' + c.mod;
    const title = '🔍 ' + kw;
    if(used.includes(title) || out.some(o=>o.title===title)) continue;
    let url, where, how;
    if(rk==='sns'){
      url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(kw);
      where = '유튜브'; how = '영상으로 배우기 좋은 주제';
    }else if(rk==='book'){
      url = 'https://search.kyobobook.co.kr/search?gbCode=TOT&target=ebook&keyword=' + encodeURIComponent(kw);
      where = '교보문고'; how = '책으로 깊게 파고들 주제';
    }else if(rk==='quote'){
      url = 'https://www.google.com/search?q=' + encodeURIComponent(kw + ' 명언');
      where = '구글'; how = '기준으로 삼을 문장 찾기';
    }else{
      url = 'https://www.google.com/search?q=' + encodeURIComponent(kw + ' 앱 추천');
      where = '구글'; how = '쓸 만한 도구 찾기';
    }
    out.push({
      title, url, why:'🔍 탐색',
      desc: `「${c.seed}」에서 뽑아낸 탐색 주제\n${where}에서 바로 검색해 볼 수 있어요\n${how}`
    });
  }
  return out;
}

function letterIcon(name, size){
  const colors = ['#4A6FA5','#E8846B','#5B9E7E','#B76E9B','#C9A227','#6B7FD7','#D77A61','#4E9DA6'];
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  const bg = colors[hash % colors.length];
  const ch = name.trim().charAt(0).toUpperCase();
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:${Math.round(size*0.25)}px;background:${bg};color:#fff;font-weight:800;font-size:${Math.round(size*0.5)}px;font-family:inherit">${ch}</span>`;
}

async function openRecDetail(i){
  const {dk, rk, items} = LAST_RECS;
  const r = items[i];
  if(!r) return;
  const mine = S.domains[dk].insights[rk].map(x=>x.text);
  const added = mine.includes(r.title);
  
  // 3줄 요약이 없으면 AI로 생성 시도
  if(!r.desc){
    renderRecDetail(dk, rk, i, r, added, '요약을 불러오는 중…');
    try{
      const out = await callAI(`"${r.title}"이(가) 무엇인지 정확히 3줄로 요약하라. 각 줄은 짧고 명확하게. 1줄: 이것이 무엇인지, 2줄: 핵심 기능/내용, 3줄: 어떤 사람에게 좋은지.\n\nJSON만 출력: {"desc":"1줄\\n2줄\\n3줄"}`);
      r.desc = out.desc || r.why || '';
    }catch(e){
      r.desc = r.why || '설명을 불러올 수 없어요.';
    }
  }
  renderRecDetail(dk, rk, i, r, added, null);
}

function normalizeUrl(u){
  u = u.trim();
  if(!u) return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; // 스킴 없으면 https 붙임
  return u;
}

let calCursor = new Date();
function renderCalendarPage(m){
  const y=calCursor.getFullYear(), mo=calCursor.getMonth();
  const first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate();
  const marks = {};
  S.calendar.forEach(e=>{ (marks[e.date]=marks[e.date]||[]).push(e); });
  
  let html = `<div class="page-title">📅 일정</div>
  <div class="page-sub">모든 도메인의 일정을 한곳에서 관리하세요.</div>
  <div class="card">
    <div class="cal-head">
      <button class="btn btn-sm btn-outline" onclick="calMovePage(-1)">◀</button>
      <b>${y}년 ${mo+1}월</b>
      <button class="btn btn-sm btn-outline" onclick="calMovePage(1)">▶</button>
    </div>
    <div class="cal-grid">${['일','월','화','수','목','금','토'].map(w=>`<div class="dow">${w}</div>`).join('')}`;
  
  for(let i=0;i<first;i++) html+='<div></div>';
  for(let day=1;day<=days;day++){
    const key = `${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = key===todayStr();
    const events = marks[key]||[];
    const ms = events.length? `<span class="m plan"></span>` : '';
    const cnt = events.length? `<span style="font-size:11px;color:var(--sub)">${events.length}</span>` : '';
    html += `<div class="cal-day ${isToday?'today':''}" onclick="openDayEvents('${key}')" style="position:relative">${day}<div class="marks">${ms}${cnt}</div></div>`;
  }
  html += '</div></div>';
  
  // 다음 7일 일정
  html += `<div class="card"><h3>📌 이번 주 일정</h3>`;
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate()+i);
    const key = d.toISOString().slice(0,10);
    const events = marks[key]||[];
    if(events.length){
      html += `<div style="margin-bottom:12px"><div class="when">${key}</div>
        ${events.map(e=>`<div class="day-item">📌 ${esc(e.text)}<button class="del" onclick="delCalEvent('${e.id}')">삭제</button></div>`).join('')}</div>`;
    }
  }
  html += `</div>`;
  
  m.innerHTML = html;
}
function calMovePage(dir){
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+dir, 1);
  renderCalendarPage(document.getElementById('main'));
}
function openDayEvents(dateKey){
  const events = S.calendar.filter(e=>e.date===dateKey);
  const [y,mo,day] = dateKey.split('-');
  openModal(`<h3>🗓 ${+mo}월 ${+day}일</h3>
    ${events.map(e=>`<div class="day-item">${esc(e.text)}<button class="del" onclick="delCalEvent('${e.id}')">삭제</button></div>`).join('')}
    ${events.length===0?'<div class="empty" style="margin-bottom:10px">이 날의 일정이 없어요</div>':''}
    <input id="mEvent" placeholder="일정 추가" style="margin-top:8px">
    <div class="modal-actions">
      <button class="btn btn-sm btn-outline" onclick="closeModal()">닫기</button>
      <button class="btn btn-sm btn-accent" onclick="addCalEvent('${dateKey}')">일정 추가</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById('mEvent'); el&&el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') addCalEvent(dateKey); }); },0);
}
function addCalEvent(dateKey){
  const v = document.getElementById('mEvent').value.trim();
  if(!v) return;
  S.calendar.push({id:uid(),date:dateKey,text:v});
  save(); openDayEvents(dateKey);
  renderCalendarPage(document.getElementById('main'));
}
function delCalEvent(id){
  S.calendar = S.calendar.filter(e=>e.id!==id);
  save(); renderCalendarPage(document.getElementById('main'));
}

async function getRecovery(btn){
  const state = document.getElementById('hpmpState').value.trim();
  if(!state){ document.getElementById('hpmpState').placeholder='상태를 먼저 적어주세요!'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="loading">AI가 처방 중</span>';
  try{
    const out = await callAI(`너는 인생 관리 앱 DLS의 회복 처방 AI다. 사용자의 현재 상태를 읽고 몸(HP)과 마음(MP)을 회복시킬 활동을 처방하라.

[사용자의 현재 상태]
${state}

[현재 수치] HP ${S.hp}/100, MP ${S.mp}/100

규칙:
1. 상태를 읽고 무엇이 부족한지(몸 피로/마음 소진/둘 다) 판단해서 comment에 한두 문장으로 공감+진단을 써라.
2. 회복 활동 3~5개를 추천하라. 숙면, 운동, 산책, 여행, 맛집 탐방, 분위기 좋은 카페, 취미, 친구 만나기, 음악, 명상, 목욕 등 무엇이든 좋다. 사용자 상태에 맞는 것이어야 한다.
3. 각 활동은 title(짧게), why(왜 지금 이게 좋은지 한 문장), hp(0~25), mp(0~25) 회복량을 포함하라. 몸 회복 활동은 hp가 높고, 마음 회복 활동은 mp가 높다.
4. 오늘 바로 실행 가능한 것 위주로, 큰 것(여행 등)은 1개 정도만.

아래 JSON만 출력. 다른 텍스트, 마크다운 금지:
{"comment":"...","items":[{"title":"...","why":"...","hp":10,"mp":15}]}`);
    S.hpmpRecs = {comment:out.comment, items:(out.items||[]).slice(0,5), state};
  }catch(e){
    S.hpmpRecs = {comment:'AI 연결에 실패했어요. 기본 처방을 드릴게요.', items:[
      {title:'따뜻한 샤워 후 일찍 잠들기',why:'몸과 마음 모두 리셋하는 가장 확실한 방법',hp:15,mp:10},
      {title:'좋아하는 음악 들으며 동네 산책',why:'가볍게 움직이면 머리가 맑아져요',hp:8,mp:12},
      {title:'분위기 좋은 카페에서 멍때리기',why:'아무것도 안 하는 시간도 회복이에요',hp:3,mp:15}
    ], state};
  }
  save(); renderHpmp(document.getElementById('main'));
}
function doRecovery(i){
  const r = (S.hpmpRecs&&S.hpmpRecs.items||[])[i];
  if(!r) return;
  S.hp = Math.min(100, S.hp + (r.hp||0));
  S.mp = Math.min(100, S.mp + (r.mp||0));
  S.hpmpLog.push({text:`${r.title} (HP+${r.hp||0}, MP+${r.mp||0})`,when:Date.now()});
  save(); renderHpmp(document.getElementById('main'));
}

function appContext(){
  // 앱 전체 상태를 요약해 AI에게 전달
  const parts = [];
  Object.keys(S.domains).forEach(dk=>{
    const d = S.domains[dk];
    const active = d.quests.find(q=>q.status==='active');
    const doneCnt = d.quests.filter(q=>q.status==='done').length;
    const recent = d.records.slice(-2).map(r=>r.text).join(' / ');
    parts.push(`[${dk}] 현재:${d.nav.current||'미입력'} | 목표:${d.nav.goal||'미입력'} | 진행퀘스트:${active?active.text:'없음'} | 완료:${doneCnt}개${recent?' | 최근기록:'+recent:''}`);
  });
  parts.push(`[HP/MP] ${S.hp}/100, ${S.mp}/100`);
  const upcoming = (S.calendar||[]).filter(e=>e.date>=todayStr()).slice(0,5).map(e=>e.date+' '+e.text).join(', ');
  if(upcoming) parts.push(`[다가오는 일정] ${upcoming}`);
  return parts.join('\n');
}

function renderChat(m){
  if(!S.chat) S.chat = [];
  m.innerHTML = `
  <div class="page-title">🤖 AI 상담</div>
  <div class="page-sub">DLS의 모든 데이터를 아는 AI와 대화하세요. 도메인 상태·퀘스트·기록을 바탕으로 답합니다.</div>
  <div class="card" style="display:flex;flex-direction:column;min-height:60vh">
    <div id="chatLog" style="flex:1;overflow-y:auto;margin-bottom:12px">
      ${S.chat.length? S.chat.map(msg=>`
        <div style="display:flex;justify-content:${msg.role==='user'?'flex-end':'flex-start'};margin-bottom:10px">
          <div style="max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;${msg.role==='user'?'background:var(--accent);color:#fff':'background:#f1f3f5'}">${esc(msg.content)}</div>
        </div>`).join('') : '<div class="empty">첫 질문을 던져보세요. 예: "요즘 나 어느 영역이 제일 약해?" / "이번 주 뭐부터 하면 좋을까?"</div>'}
    </div>
    <div style="display:flex;gap:8px">
      <input class="field" id="chatInput" placeholder="메시지 입력…" style="flex:1" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn btn-sm btn-accent" id="chatSendBtn" onclick="sendChat()">전송</button>
    </div>
    ${S.chat.length?`<div style="margin-top:8px;text-align:right"><button class="btn btn-sm btn-outline" onclick="clearChat()">대화 초기화</button></div>`:''}
  </div>`;
  const log = document.getElementById('chatLog');
  if(log) log.scrollTop = log.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  if(!S.chat) S.chat = [];
  S.chat.push({role:'user', content:text, when:Date.now()});
  save(); renderChat(document.getElementById('main'));
  
  const btn = document.getElementById('chatSendBtn');
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  
  try{
    // 시스템 컨텍스트 + 최근 대화 12개
    const sys = `너는 DLS(Digibooks Life OS)의 AI 상담사다. 사용자는 삶을 8개 영역으로 나눠 관리하는 ENTJ 성향의 사용자다. 아래는 사용자의 현재 앱 데이터다. 이 데이터를 근거로 구체적이고 실용적으로 답하라. 근거 없는 추측은 하지 말고, 데이터에서 보이는 패턴을 짚어라. 답변은 간결하게, 한국어로.\n\n${appContext()}`;
    const history = S.chat.slice(-12).map(msg=>({role:msg.role==='user'?'user':'assistant', content:msg.content}));
    const messages = [{role:'user', content:sys+'\n\n---\n첫 메시지: '+history[0].content}].concat(history.slice(1));
    
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:(()=>{ const h={"Content-Type":"application/json"}; const k=getApiKey(); if(k){h["x-api-key"]=k;h["anthropic-version"]="2023-06-01";h["anthropic-dangerous-direct-browser-access"]="true";} return h; })(),
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,messages})
    });
    if(!res.ok) throw new Error('API '+res.status);
    const data = await res.json();
    const reply = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    S.chat.push({role:'assistant', content:reply||'(응답 없음)', when:Date.now()});
  }catch(e){
    S.chat.push({role:'assistant', content:'AI 연결에 실패했어요. '+(getApiKey()?'잠시 후 다시 시도해주세요.':'설정에서 Claude API 키를 등록하면 어디서든 상담할 수 있어요.'), when:Date.now()});
  }
  save(); renderChat(document.getElementById('main'));
}

function clearChat(){
  S.chat = [];
  save(); renderChat(document.getElementById('main'));
}

  </div>
  ${role==='owner'?`

  </div>`:''}
  <div class="card"><h3>🔑 Claude API 키</h3>
    <p class="notice" style="margin-bottom:8px">깃허브 등 외부에서 열 때 AI 기능(퀘스트 생성·추천·회복 처방·AI 상담)을 쓰려면 API 키가 필요합니다. <b>키는 이 기기에만 저장</b>되고 외부로 공유되지 않습니다. console.anthropic.com에서 발급.</p>
    <div style="display:flex;gap:8px">
      <input class="field" id="apiKeyInput" type="password" placeholder="sk-ant-..." value="${getApiKey()?'••••••••'+getApiKey().slice(-4):''}" style="flex:1">
      <button class="btn btn-sm btn-accent" onclick="saveApiKey()">저장</button>
      ${getApiKey()?`<button class="btn btn-sm btn-outline" onclick="removeApiKey()">삭제</button>`:''}
    </div>
    <p class="muted" style="margin-top:6px;font-size:12px">상태: ${getApiKey()?'✓ 키 등록됨 — AI 기능 사용 가능':'키 없음 — Claude 미리보기에서만 AI 작동'}</p>

    <p class="notice">현재 데이터는 이 기기의 localStorage에만 저장됩니다. 출시 전 Supabase 연동이 필요합니다.</p>

function saveApiKey(){
  const v = document.getElementById('apiKeyInput').value.trim();
  if(!v || v.startsWith('•')){ alert('새 API 키를 입력해주세요.'); return; }
  if(!v.startsWith('sk-ant-')){ alert('올바른 Anthropic API 키 형식이 아니에요. (sk-ant-로 시작)'); return; }
  localStorage.setItem('dls_api_key', v);
  go('settings');
}
function removeApiKey(){
  localStorage.removeItem('dls_api_key');
  go('settings');
}
function setTestMode(mode){
  localStorage.removeItem('dls_test_weekday');
  localStorage.removeItem('dls_test_weekend');
  if(mode==='weekday') localStorage.setItem('dls_test_weekday','true');
  else if(mode==='weekend') localStorage.setItem('dls_test_weekend','true');
  applyModeSwitch(true);
}
function applyModeSwitch(navigate){
  const testWeekday = localStorage.getItem('dls_test_weekday')==='true';
  const testWeekend = localStorage.getItem('dls_test_weekend')==='true';
  const dow = testWeekday ? 1 : (testWeekend ? 6 : new Date().getDay());
  const isWeekend = dow===0 || dow===6;
  const userNav = document.getElementById('userNav');
  const creatorNav = document.getElementById('creatorNav');
  if(role==='owner'){
    if(isWeekend){
      userNav.classList.add('hidden');
      creatorNav.classList.remove('hidden');
      if(navigate) go('d:기술화');
    }else{
      userNav.classList.remove('hidden');
      creatorNav.classList.add('hidden');
      if(navigate) go('d:학벌');
    }
  }else{
    userNav.classList.remove('hidden');
    creatorNav.classList.add('hidden');
    if(navigate) go('d:학벌');
  }
  return isWeekend;
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `dls-backup-${todayStr()}.json`; a.click();
}
function logout(){
  // 데이터는 유지, 화면만 로그인으로 전환
  role = null; S = null; view = null;
  document.getElementById('main').innerHTML = '';
  document.getElementById('fabList').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('creatorNav').classList.remove('hidden');
  document.getElementById('pwInput').value = '';
  document.getElementById('loginMsg').textContent = '';
  document.getElementById('loginScreen').classList.remove('hidden');
}
function clearData(){
  openModal(`<h3>🗑 데이터 지우기</h3>
    <p class="muted" style="margin-bottom:12px">모든 데이터를 지울까요? 되돌릴 수 없습니다.</p>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn btn-sm btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-sm" style="background:var(--red);color:#fff" onclick="doClearData()">지우기</button>
    </div>`);
}
function doClearData(){
  const apiKey = localStorage.getItem('dls_api_key');
  try{
    Object.keys(localStorage).forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
  if(apiKey){ try{ localStorage.setItem('dls_api_key', apiKey); }catch(e){} }
  try{
    Object.keys(sessionStorage).forEach(k=>{ try{ sessionStorage.removeItem(k); }catch(e){} });
  }catch(e){}
  closeModal();
  // 새로고침 없이 앱 상태를 직접 리셋하고 로그인 화면으로
  role = null; S = null; view = null;
  document.getElementById('main').innerHTML = '';
  document.getElementById('fabList').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('creatorNav').classList.remove('hidden');
  document.getElementById('pwInput').value = '';
  document.getElementById('loginMsg').textContent = '데이터가 모두 삭제되었습니다.';
  document.getElementById('loginScreen').classList.remove('hidden');
}
function loadSampleData(){
  if(!S) load();
  const domains = Object.keys(DOMAINS);
  domains.forEach(dk=>{
    const d = S.domains[dk];
    d.nav.current = `${dk}의 현재 수준은 중간 정도`;
    d.nav.goal = `${dk} 분야에서 전문성 쌓기`;
    // 샘플 퀘스트
    d.quests.push({id:uid(),text:`${dk} 관련 콘텐츠 30분 공부`,cat:'',status:'done',createdAt:Date.now()-86400000,clearedAt:Date.now()-75600000,review:'실질적인 배움을 얻었다'});
    d.quests.push({id:uid(),text:`${dk} 목표를 위해 오늘 실행 가능한 한 걸음 밟기`,cat:'',status:'active',createdAt:Date.now()});
    // 샘플 인사이트
    const recApps = (RECS[dk]&&RECS[dk].app)||[];
    const recSns = (RECS[dk]&&RECS[dk].sns)||[];
    if(recApps.length>0) d.insights.app.push({id:uid(),text:recApps[0].t,cat:'',starred:false,url:recApps[0].u||''});
    if(recSns.length>0) d.insights.sns.push({id:uid(),text:recSns[0].t,cat:'',starred:false,url:recSns[0].u||''});
    // 샘플 기록
    d.records.push({id:uid(),text:`${dk}에 관련된 학습 자료를 발견했다`,cat:'',when:Date.now()-172800000});
    d.records.push({id:uid(),text:`앞으로의 방향을 더 명확히 했다`,cat:'',when:Date.now()});
  });
  S.hp = 65; S.mp = 72;
  S.hpmpLog.push({text:'샘플 데이터 로드됨',when:Date.now()});
  // 샘플 캘린더 일정
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  S.calendar.push({id:uid(),date:tomorrow.toISOString().slice(0,10),text:'샘플 일정'});
  save();
  go('d:학벌');
}

/* =============== 모달 =============== */
function openModal(html, fullscreen){
  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  if(fullscreen){ box.classList.add('modal-full'); } else { box.classList.remove('modal-full'); }
  document.getElementById('modalBack').classList.remove('hidden');
}
/* =============== 시작 시 세션 자동 복원 =============== */
(async function boot(){
  try{
    await initSupabase();
    if(!sb) return;
    const {data:{session}} = await sb.auth.getSession();
    if(session && session.user){
      authUser = session.user;
      role = roleFor(authUser);
      enter();                       // 로그인 화면 건너뛰고 바로 진입
    }
  }catch(e){ console.log('세션 확인 건너뜀:', e.message); }
})();

function closeModal(){
  document.getElementById('modalBack').classList.add('hidden');
  // 모달에서 변경된 데이터가 뒤 화면에 바로 반영되도록 재렌더링
  const appEl = document.getElementById('app');
  if(view && appEl && !appEl.classList.contains('hidden') && S){
    const sy = window.scrollY;
    go(view);
    window.scrollTo(0, sy);
  }
}
